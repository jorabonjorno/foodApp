name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Новый пуш отменяет старую сборку — экономим минуты раннеров.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generated-files:
    name: Recipes & strings are up to date
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_recipes.py --check
      - run: python3 tools/build_strings.py --check

  backend:
    name: Proxy typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx tsc --noEmit

  ios:
    name: iOS build & unit tests
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -v beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      - name: Pick iPhone simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          phones = [d for runtime, items in devices.items() if 'iOS' in runtime for d in items if d['name'].startswith('iPhone')]
          print(phones[-1]['udid'])
          ")
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Build & test
        run: |
          set +e
          xcodebuild test \
            -project FoodApp.xcodeproj \
            -scheme FoodApp \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO > xcodebuild.log 2>&1
          STATUS=$?
          grep -E "error:|Test Case .*failed|\*\* (BUILD|TEST) (SUCCEEDED|FAILED)|Executed [0-9]+ test" xcodebuild.log | sort -u | head -200
          # Итог тестов — аннотацией, чтобы он был виден без входа в GitHub.
          SUMMARY=$(grep -E "Executed [0-9]+ tests?, with" xcodebuild.log | tail -1 | sed 's/^[[:space:]]*//')
          [ -n "$SUMMARY" ] && echo "::notice title=Unit tests::$SUMMARY"
          if [ $STATUS -ne 0 ]; then
            echo "----- tail -----"; tail -n 60 xcodebuild.log
            # Ошибки → аннотации GitHub (видны на странице прогона и через API без логина).
            python3 .github/scripts/annotate.py xcodebuild.log
          fi
          exit $STATUS

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: xcodebuild-logs
          path: |
            xcodebuild.log
            TestResults.xcresult
          retention-days: 7
